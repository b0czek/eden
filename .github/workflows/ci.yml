name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:unit

  node-integration:
    name: Node integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Node integration tests
        run: pnpm test:integration:node

  architecture:
    name: SDK architecture
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check SDK architecture boundaries
        run: pnpm check:architecture

  electron-integration:
    name: Electron integration
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Electron integration tests
        run: xvfb-run --auto-servernum pnpm test:integration:electron

      - name: Capture process diagnostics
        if: failure()
        run: |
          mkdir -p packages/sdk/electron-integration/test-results/diagnostics
          ps -ef > packages/sdk/electron-integration/test-results/diagnostics/processes.txt
          pgrep -a -f 'electron|eden-backend' > packages/sdk/electron-integration/test-results/diagnostics/eden-processes.txt || true

      - name: Clean up Electron processes
        if: always()
        run: |
          pkill -TERM -f '[e]lectron-integration/host.cjs' || true
          pkill -TERM -f '[e]den-backend' || true
          pkill -TERM -f '[e]lectron.*--type=' || true
          pkill -KILL -f '[e]lectron-integration/host.cjs' || true
          pkill -KILL -f '[e]den-backend' || true
          pkill -KILL -f '[e]lectron.*--type=' || true

      - name: Upload Electron failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eden-electron-integration-${{ github.run_id }}
          path: |
            packages/sdk/electron-integration/test-results
            packages/sdk/playwright-report
          if-no-files-found: warn
          retention-days: 3

  typecheck:
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck
