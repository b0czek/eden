  '@types/jest': ^30.0.0
  '@types/node': ^26.6.5
  commander: ^15.0.0
  concurrently: ^10.0.6
  electron: ^44.7.0
  jest: ^30.5.2
  jsdom: ^30.1.2
  semver: ^7.7.3
